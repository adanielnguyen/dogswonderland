  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Static copy of the booking form so Netlify Forms detects its fields at deploy time -->
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="ownerName" /><input name="ownerEmail" /><input name="ownerPhone" />
      <input name="dogName" /><input name="dogBreed" /><input name="dogAge" />
      <input name="dogSize" /><input name="isReactive" />
      <input name="checkIn" /><input name="checkOut" />
      <textarea name="message"></textarea>
    </form>
